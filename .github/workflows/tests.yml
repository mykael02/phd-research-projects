name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stdlib-projects:
    name: nav-baseline, exit-finding, radiation-aware-inspection
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s projects/nav-baseline/tests -t projects/nav-baseline -v
      - run: python -m unittest discover -s projects/exit-finding -p "test_*.py" -v
      - run: python -m unittest discover -s projects/radiation-aware-inspection -p "test_*.py" -v
      - run: python projects/nav-baseline/run_experiments.py
      - run: python projects/nav-baseline/run_rrt_experiments.py
      - run: python projects/exit-finding/run_experiments.py --output "$RUNNER_TEMP/exit"
      - run: python projects/radiation-aware-inspection/run_experiments.py --output "$RUNNER_TEMP/plant"

  sparse-rgb-starter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/sparse-rgb-starter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m sparse_rgb pilot --config configs/clean.toml --output runs/clean
      - run: python -m sparse_rgb pilot --config configs/pilot.toml --output runs/noisy
      - run: python -m sparse_rgb validate runs/noisy/dataset/manifest.json
