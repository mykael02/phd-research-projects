<div id="robot-replay-v1">
  <style>
    #robot-replay-v1 { display: grid; gap: calc(var(--font-size-base) * 1); color: var(--foreground); }
    #robot-replay-v1 .map-stage { width: 100%; max-width: 640px; }
    #robot-replay-v1 .map { display: block; width: 100%; }
    #robot-replay-v1 .legend { display: flex; flex-wrap: wrap; gap: calc(var(--font-size-base) * .75); }
    #robot-replay-v1 .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: middle; }
    #robot-replay-v1 .route-key { background: var(--viz-series-1); }
    #robot-replay-v1 .wall-key { background: var(--muted-foreground); }
    #robot-replay-v1 .unknown-key { background: var(--muted); }
    #robot-replay-v1 .heat-key { background: var(--viz-series-2); }
  </style>
  <h2>Robot experiments</h2>
  <div class="viz-controls">
    <label class="form-label">Project

    <label class="form-label">Scenario<select id="rr-scenario" class="form-select"></select></label>
    <label class="form-label">Policy<select id="rr-policy" class="form-select"></select></label>

  <div id="rr-context" class="text-small text-muted"></div>

    <svg id="rr-map" class="map" role="img" aria-label="Robot route replay"></svg>
  </div>
  <div class="legend text-small">
    <span><span class="swatch route-key"></span>Route · circle = robot</span>
    <span><span class="swatch wall-key"></span>Wall</span>
    <span id="rr-unknown"><span class="swatch unknown-key"></span>? Unknown</span>

    <span id="rr-labels"></span>

  <div class="viz-row">
    <button id="rr-play" type="button" class="btn btn-primary">Replay</button>

  <script>
  (() => {
    const root = document.getElementById('robot-replay-v1');
    const $ = id => root.querySelector('#rr-' + id);
    const data = JSON.parse($('data').textContent);
    const names = {branching:'Branching corridors', open_room:'Open room', unreachable:'Unreachable exit', standard:'Standard budgets', tight_dose:'Tight dose budget', tight_battery:'Tight battery budget', zero_budget:'Zero budget', frontier:'Nearest frontier', random:'Random walk', dose_aware:'Dose aware', shortest:'Shortest route'};
    let project='exit', scenario='branching', policy='frontier', frame=0, timer=null, current=null;
    const eq = (a,b) => a[0]===b[0] && a[1]===b[1];
    const key = cell => cell.join(',');
    function stop() { if(timer!==null) clearInterval(timer); timer=null; $('play').textContent='Replay'; }
    function save() {
      if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{project,scenario,policy},privateContent:{frame,truth:$('truth').checked}}).catch(()=>{});
    }
    function options(element, values, value) {
      element.innerHTML=values.map(v=>`<option value="${v}">${names[v]||v}</option>`).join('');
      element.value=value;
    }
    function load(preferredFrame) {
      stop();
      const group=data[project], scenarios=Object.keys(group.maps);
      if(!scenarios.includes(scenario)) scenario=scenarios[0];
      const policies=project==='exit'?['frontier','random']:['dose_aware','shortest'];
      if(!policies.includes(policy)) policy=policies[0];
      $('project').value=project;
      options($('scenario'), scenarios, scenario); options($('policy'),policies,policy);
      current=group.runs.find(r=>r.scenario===scenario && r.policy===policy);
      frame=Number.isFinite(preferredFrame)?Math.min(Math.max(0,Math.floor(preferredFrame)),current.timeline.length-1):current.timeline.length-1;
      $('slider').max=current.timeline.length-1;
      $('truth-label').hidden=project!=='exit'; $('unknown').hidden=project!=='exit'; $('heat').hidden=project!=='plant';
      $('labels').textContent=project==='exit'?'S Start · E Exit':'B Base · 1–3 Inspection points · ✓ Inspected';
      $('context').textContent=project==='exit'?'Recorded run · seed 7 · perfect local sensing · point robot':`Recorded run · known synthetic radiation field · battery ${current.battery_budget} · dose limit ${current.dose_budget}`;
      const peer=group.runs.find(r=>r.scenario===scenario && r.policy!==policy);
      $('comparison').textContent=project==='exit'?`Final comparison: ${names[policy]} ${current.steps} moves (${current.success?'exit reached':'exit not reached'}); ${names[peer.policy]} ${peer.steps} (${peer.success?'exit reached':'exit not reached'}).`:`Final comparison: ${names[policy]} ${current.completed}/3 inspections, dose ${current.dose.toFixed(2)}; ${names[peer.policy]} ${peer.completed}/3, dose ${peer.dose.toFixed(2)}. Arbitrary simulation units.`;
      render(true);
    }
    function render(announce=false) {
      const world=data[project].maps[scenario], timeline=current.timeline, state=timeline[frame];
      const svg=$('map'), width=Math.max(200,svg.parentElement.getBoundingClientRect().width||600);
      const cols=world.rows[0].length, rows=world.rows.length, cell=width/cols, height=rows*cell;
      svg.setAttribute('viewBox',`0 0 ${width} ${height}`); svg.setAttribute('height',height);
      const seen=new Set();
      timeline.slice(0,frame+1).forEach(s=>{const [r,c]=s.position; [[r,c],[r-1,c],[r,c+1],[r+1,c],[r,c-1]].forEach(p=>seen.add(key(p)));});
      const visible=(r,c)=>project==='plant'||$('truth').checked||seen.has(`${r},${c}`);
      let markup='<title>Robot position and travelled route</title><desc>Walls are solid, unknown cells have question marks. A circle marks the current robot position.</desc>';
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
        const known=visible(r,c), wall=world.rows[r][c]==='#';
        const fill=!known?'var(--muted)':wall?'var(--muted-foreground)':'var(--background)';
        markup+=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="${fill}" stroke="var(--border)" stroke-width=".5"/>`;
        if(known&&!wall&&project==='plant') markup+=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="var(--viz-series-2)" opacity="${.08+.65*world.rates[r][c]/world.peak}"/>`;
        if(!known) markup+=`<text x="${(c+.5)*cell}" y="${(r+.5)*cell}" dominant-baseline="central" text-anchor="middle" fill="var(--muted-foreground)" class="text-small">?</text>`;
      }
      const points=timeline.slice(0,frame+1).map(s=>`${(s.position[1]+.5)*cell},${(s.position[0]+.5)*cell}`).join(' ');
      markup+=`<polyline points="${points}" fill="none" stroke="var(--viz-series-1)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
      const labels=project==='exit'?[[world.start,'S'],[world.exit,'E']]:[[world.base,'B'],...world.inspections.map((p,i)=>[p,state.inspected.some(a=>eq(a,p))?'✓':String(i+1)])];
      labels.forEach(([p,label])=>{if(visible(...p)) markup+=`<text x="${(p[1]+.5)*cell}" y="${(p[0]+.5)*cell}" dominant-baseline="central" text-anchor="middle" fill="var(--foreground)" font-weight="500">${label}</text>`;});
      const [r,c]=state.position;
      markup+=`<circle cx="${(c+.5)*cell}" cy="${(r+.5)*cell}" r="${cell*.33}" fill="var(--viz-series-1)" fill-opacity=".25" stroke="var(--viz-series-1)" stroke-width="3"/>`;
      svg.innerHTML=markup;
      svg.setAttribute('aria-label',`${names[scenario]}, ${names[policy]}, time ${frame}, robot at row ${r}, column ${c}`);
      $('slider').value=frame; $('time').textContent=`Time ${frame} / ${timeline.length-1}`;
      const finished=frame===timeline.length-1;
      const outcome=project==='exit'?(current.success?'Exit reached':current.reason==='exploration_exhausted'?'Reachable area exhausted':'Step limit reached'):(current.completed===0?'Stayed at base':'Returned to base');
      // Live region updates only on user actions and at playback completion.
      $('status').setAttribute('aria-live',announce||finished?'polite':'off');
      $('status').textContent=project==='exit'?`${finished?outcome:'Exploring'} · ${frame} moves`:`${finished?outcome:state.action} · ${state.inspected.length}/3 inspected · dose ${state.dose.toFixed(2)} / ${current.dose_budget} · battery left ${current.battery_budget-frame}`;
    }
    $('project').addEventListener('change',()=>{project=$('project').value;load();save();});
    $('scenario').addEventListener('change',()=>{scenario=$('scenario').value;load();save();});
    $('policy').addEventListener('change',()=>{policy=$('policy').value;load();save();});
    $('truth').addEventListener('change',()=>{render(true);save();});
    $('slider').addEventListener('input',()=>{stop();frame=Number($('slider').value);render(true);});
    $('slider').addEventListener('change',save);
    $('play').addEventListener('click',()=>{
      if(timer!==null){stop();render(true);save();return;}
      if(frame>=current.timeline.length-1) frame=0;
      if(current.timeline.length===1){render(true);return;}
      $('play').textContent='Pause';render(true);
      timer=setInterval(()=>{frame++;render();if(frame>=current.timeline.length-1){stop();render(true);save();}},180);
    });
    function restore(saved) {
      const model=saved?.modelContent||{}, ui=saved?.privateContent||{};
      project=model.project==='plant'?'plant':'exit';scenario=model.scenario||'branching';policy=model.policy||'frontier';
      $('truth').checked=ui.truth===true;load(ui.frame);
    }
    restore(window.openai?.widgetState);
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
    new ResizeObserver(()=>render()).observe($('map').parentElement);
  })();
  </script>
