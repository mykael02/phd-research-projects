name: CPU pilot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m sparse_rgb pilot --config configs/clean.toml --output runs/clean
      - run: python -m sparse_rgb pilot --config configs/pilot.toml --output runs/noisy
      - run: python -m sparse_rgb validate runs/noisy/dataset/manifest.json
